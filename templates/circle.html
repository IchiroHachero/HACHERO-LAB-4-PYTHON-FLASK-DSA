<!DOCTYPE html>
<head>
    <title>Area of a Circle</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <nav>
        <ul>
            <li><a href="/">Home</a></li>
            <li><a href="/profile">Profile</a></li>
            <li><a href="/works">Works</a></li>
            <li><a href="/contact">Contact</a></li>
        </ul>
    </nav>

    <h1>AREA OF A CIRCLE CALCULATOR</h1>

    <form action="/works/area/circle" method="POST">
        <label for="radius">Enter Radius:</label><br>
        <input type="number" step="any" id="radius" name="radius" placeholder="Enter a number." required><br><br>
        <button type="submit">Calculate Area</button>
    </form>

    {% if result is not none %}
        <h3>Result: {{ result }}</h3>
    {% endif %}

    <br>
    <a href="/works">Back to Works</a>

</body>
</html>
