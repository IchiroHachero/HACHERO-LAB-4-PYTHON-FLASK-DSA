<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Area of a Triangle</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <nav>
        <ul>
            <li><a href="/">Home</a></li>
            <li><a href="/profile">Profile</a></li>
            <li><a href="/works">Works</a></li>
            <li><a href="/contact">Contact</a></li>
        </ul>
    </nav>

    <h1>AREA OF A TRIANGLE CALCULATOR</h1>

    <form action="/works/area/triangle" method="POST">
        <label for="base">Enter Base:</label><br>
        <input type="number" step="any" id="base" name="base" placeholder="Enter a number." required><br><br>
        
        <label for="height">Enter Height:</label><br>
        <input type="number" step="any" id="height" name="height" placeholder="Enter a number." required><br><br>
        
        <button type="submit">Calculate Area</button>
    </form>

    {% if result is not none %}
        <h3>Result: {{ result }}</h3>
    {% endif %}

    <br>
    <a href="/works">Back to Works</a>

</body>
</html>
